[workspace]
resolver = "3"

members = [
    "crates/pcdiag" ,
    "crates/pcdiag-core",
    "crates/pcdiag-windows"
]

default-members = [
    "crates/pcdiag",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Shimahukuro/pcdiag"
publish = false

[workspace.dependencies]
pcdiag-core = { path = "crates/pcdiag-core" }
pcdiag-windows = { path = "crates/pcdiag-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
