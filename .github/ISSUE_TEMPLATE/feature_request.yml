name: 機能提案
description: 新機能や改善案を提案します
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。実機の収集成果物、ログ、個人情報、デバイス識別情報は添付しないでください。

  - type: checkboxes
    id: preflight
    attributes:
      label: 送信前の確認
      options:
        - label: 同じ内容のIssueがないことを確認しました。
          required: true
        - label: 添付内容に機密情報がないことを確認しました。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 機能そのものではなく、どのような場面で何に困るかを記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 実機情報が必要な場合でも、未加工の診断成果物は添付しないでください。
